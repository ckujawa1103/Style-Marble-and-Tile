<!doctype html>
<html lang="{{ lang }}">
<head>
{{> head }}
</head>
<body>
{{> header }}

<main id="main">

  <section class="page-head">
    <div class="wrap">
      <p class="eyebrow">{{ t.reviewsEyebrow }}</p>
      <h1>{{ t.reviewsTitle }}</h1>
      <p class="lede">{{ t.reviewsLede }}</p>
    </div>
  </section>

  <section class="band">
    <div class="wrap">
      <div class="review-grid review-grid-full">
        {{{ html.reviews }}}
      </div>
    </div>
  </section>

  <section class="band band-alt">
    <div class="wrap wrap-narrow center">
      <h2>{{ t.reviewsAskTitle }}</h2>
      <p class="lede">{{ t.reviewsAskBody }}</p>
      <p>
        <a class="btn btn-lg" href="{{ business.links.googleReview }}">{{ t.reviewsAskButton }}</a>
      </p>
    </div>
  </section>

{{> cta }}

</main>

{{> footer }}
</body>
</html>
