  <a class="skip-link" href="#main">{{ t.skipToContent }}</a>

  <div class="topbar">
    <div class="wrap topbar-inner">
      <span class="topbar-area">{{ t.topbarArea }}</span>
      <div class="topbar-right">
        <!-- A real link to a real page, not a JavaScript swap: it works with JS
             off, it can be bookmarked, and search engines index both. -->
        <a class="lang-toggle" href="{{ u.switchLang }}" hreflang="{{ page.alternateLang }}" lang="{{ page.alternateLang }}">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20m0 2c1.2 0 2.6 1.9 3.2 5H8.8C9.4 5.9 10.8 4 12 4M6.8 9H4.3a8 8 0 0 1 4-4.2A13 13 0 0 0 6.8 9m-2.6 2h2.3a20 20 0 0 0 0 2H4.2a8 8 0 0 1 0-2m.1 4h2.5a13 13 0 0 0 1.4 4.2A8 8 0 0 1 4.3 15M8.8 15h6.4c-.6 3.1-2 5-3.2 5s-2.6-1.9-3.2-5m.3-2a18 18 0 0 1 0-2h5.8a18 18 0 0 1 0 2zm8.1 6.2a13 13 0 0 0 1.4-4.2h2.5a8 8 0 0 1-3.9 4.2M19.8 13h-2.3a20 20 0 0 0 0-2h2.3a8 8 0 0 1 0 2m-2.5-4a13 13 0 0 0-1.4-4.2 8 8 0 0 1 3.8 4.2z"/></svg>
          {{ t.switchToShort }}
        </a>
        <a class="topbar-phone" href="{{ business.telHref }}">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24 11.4 11.4 0 0 0 3.6.58 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.6a1 1 0 0 1-.25 1z"/></svg>
          {{ business.phone }}
        </a>
      </div>
    </div>
  </div>

  <header class="masthead">
    <div class="wrap masthead-inner">
      <a class="brand" href="{{ u.home }}">
        <img src="{{ u.logo }}" alt="" width="38" height="38">
        <span class="brand-text">
          <strong>Style Marble</strong>
          <em>and Tile</em>
        </span>
      </a>

      <button class="nav-toggle" aria-expanded="false" aria-controls="nav" aria-label="{{ t.menu }}">
        <span></span><span></span><span></span>
      </button>

      <nav id="nav" class="nav" aria-label="{{ t.mainNav }}">
        <a href="{{ u.services }}">{{ t.navServices }}</a>
        <a href="{{ u.gallery }}">{{ t.navGallery }}</a>
        <a href="{{ u.reviews }}">{{ t.navReviews }}</a>
        <a href="{{ u.contact }}">{{ t.navContact }}</a>
        <a class="nav-lang" href="{{ u.switchLang }}" hreflang="{{ page.alternateLang }}" lang="{{ page.alternateLang }}">{{ t.switchToShort }}</a>
        <a class="btn btn-sm" href="{{ u.contact }}">{{ t.navEstimate }}</a>
      </nav>
    </div>
  </header>
